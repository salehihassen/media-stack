name: media-extract

x-common: &common
  restart: unless-stopped
  environment:
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-America/New_York}
  networks:
    - media

services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: media-gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-America/New_York}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?Set VPN_SERVICE_PROVIDER in .env}
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      OPENVPN_PROTOCOL: ${OPENVPN_PROTOCOL:-udp}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      PORT_FORWARD_ONLY: ${PORT_FORWARD_ONLY:-off}
      FIREWALL_INPUT_PORTS: "8080"
    volumes:
      - ./config/gluetun:/gluetun
    ports:
      - "127.0.0.1:${QBITTORRENT_PORT:-8080}:8080"
    networks:
      - media
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: media-qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/New_York}
      WEBUI_PORT: 8080
      TORRENTING_PORT: ${TORRENTING_PORT:-6881}
    volumes:
      - ./config/qbittorrent:/config
      - ./data/torrent:/data/torrent

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: media-prowlarr
    ports:
      - "127.0.0.1:${PROWLARR_PORT:-9696}:9696"
    volumes:
      - ./config/prowlarr:/config

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: media-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-America/New_York}
    networks:
      - media

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: media-sonarr
    ports:
      - "127.0.0.1:${SONARR_PORT:-8989}:8989"
    volumes:
      - ./config/sonarr:/config
      - ./data/torrent:/data/torrent:ro
      - ./data/makemkv/output:/data/import/makemkv:ro
      - ./data/handbrake/output:/data/import/handbrake:ro
      - ./data/media/tv:/data/media/tv

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: media-radarr
    ports:
      - "127.0.0.1:${RADARR_PORT:-7878}:7878"
    volumes:
      - ./config/radarr:/config
      - ./data/torrent:/data/torrent:ro
      - ./data/makemkv/output:/data/import/makemkv:ro
      - ./data/handbrake/output:/data/import/handbrake:ro
      - ./data/media/movies:/data/media/movies

  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: media-jellyfin
    ports:
      - "0.0.0.0:${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ./config/jellyfin:/config
      - ./data/jellyfin/cache:/cache
      - ./data/media:/data/media:ro
    # Linux hosts with Intel/AMD graphics can uncomment this for transcoding:
    # devices:
    #   - /dev/dri:/dev/dri

  makemkv:
    image: jlesage/makemkv:latest
    container_name: media-makemkv
    profiles: ["rip"]
    restart: unless-stopped
    environment:
      USER_ID: ${PUID:-1000}
      GROUP_ID: ${PGID:-1000}
      TZ: ${TZ:-America/New_York}
      AUTO_DISC_RIPPER: "1"
      AUTO_DISC_RIPPER_EJECT: "1"
      AUTO_DISC_RIPPER_FORCE_UNIQUE_OUTPUT_DIR: "1"
    ports:
      - "127.0.0.1:${MAKEMKV_PORT:-5800}:5800"
    volumes:
      - ./config/makemkv:/config
      - ./data/makemkv/storage:/storage
      - ./data/makemkv/output:/output
    devices:
      - ${DVD_DEVICE:-/dev/sr0}:${DVD_DEVICE:-/dev/sr0}
      - ${DVD_SG_DEVICE:-/dev/sg0}:${DVD_SG_DEVICE:-/dev/sg0}
    networks:
      - media

  handbrake:
    image: jlesage/handbrake:latest
    container_name: media-handbrake
    profiles: ["rip"]
    restart: unless-stopped
    environment:
      USER_ID: ${PUID:-1000}
      GROUP_ID: ${PGID:-1000}
      TZ: ${TZ:-America/New_York}
    ports:
      - "127.0.0.1:${HANDBRAKE_PORT:-5801}:5800"
    volumes:
      - ./config/handbrake:/config
      - ./data/makemkv/output:/storage:ro
      - ./data/handbrake/output:/output
    networks:
      - media

networks:
  media:
    name: media-extract
